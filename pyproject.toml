[project]
name = "fraud-detection-ml"
version = "1.0.0"
description = "Production-style educational fraud risk scoring and decision-support system for synthetic financial transactions, demonstrating temporal validation, class-imbalance handling, threshold optimisation, explainability and monitored inference."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Adetlo" }]
keywords = ["machine-learning", "fintech", "fraud-detection", "fraud-risk", "imbalanced-learning", "mlops", "model-monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=17.0",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "joblib>=1.4",
  "mlflow-skinny>=2.16",
  "matplotlib>=3.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
]

[project.scripts]
fraud-ml = "fraud_ml.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_ml"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF", "SIM", "DTZ", "T20", "PL"]
ignore = ["RUF012", "PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "PLC0415", "PLR0914", "PLR6301"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "DTZ", "PLR", "RUF043", "E501"]
"scripts/**" = ["T201", "S101", "E501"]
"src/fraud_ml/cli/main.py" = ["E501"]  # Typer option declarations

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["fraud_ml"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "joblib", "joblib.*", "mlflow", "mlflow.*", "pyarrow", "pyarrow.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that train on larger volumes",
]
filterwarnings = [
  "error::DeprecationWarning:fraud_ml.*",
]

[tool.coverage.run]
source = ["fraud_ml"]
branch = true
omit = ["src/fraud_ml/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
