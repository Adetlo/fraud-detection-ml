name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRAUD_ML_MLFLOW_ENABLED: "false"
  FRAUD_ML_LOG_FORMAT: json

jobs:
  quality:
    name: Lint, format and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy --strict src

  test:
    name: Unit, property, integration, API and e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen
      - name: Pytest with coverage (includes the lightweight model e2e)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Lightweight CLI demo (generate -> train -> score -> drift)
        run: uv run fraud-ml demo --transactions 8000 --fraud-rate 0.015 --seed 7 --fast --no-mlflow --workdir ci-demo
      - name: Upload coverage and demo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-and-reports
          path: |
            coverage.xml
            ci-demo/reports/*.json
            ci-demo/reports/*.csv
            ci-demo/reports/*.png

  security:
    name: Dependency and code security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen
      - name: pip-audit (known vulnerabilities in locked dependencies)
        run: |
          uv export --frozen --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --strict --desc on
      - name: Bandit (static security analysis)
        run: uv run bandit -c pyproject.toml -r src -q

  docker:
    name: Docker image build, readiness and score smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fraud-detection-ml:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the API (bootstraps a small model on first start)
        run: |
          docker run -d --name fraud-ml -p 8000:8000 -e FRAUD_ML_BOOTSTRAP_ROWS=8000 fraud-detection-ml:ci
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null 2>&1; then
              echo "ready after ${i} attempts"; exit 0
            fi
            sleep 3
          done
          echo "API did not become ready"; docker logs fraud-ml; exit 1
      - name: Score smoke test
        run: |
          curl -fsS http://127.0.0.1:8000/api/v1/model | python3 -m json.tool
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/score \
            -H 'Content-Type: application/json' \
            --data @examples/transaction.json | tee /tmp/score.json | python3 -m json.tool
          python3 -c "import json; s=json.load(open('/tmp/score.json')); assert 0<=s['risk_probability']<=1 and s['decision_support'] in {'PASS','REVIEW','PRIORITY_REVIEW'}"
          curl -sS -o /dev/null -w '%{http_code}\n' -X POST http://127.0.0.1:8000/api/v1/score -H 'Content-Type: application/json' -d '{"transaction_id":"x"}' | grep -q 422
      - name: Container logs
        if: always()
        run: docker logs fraud-ml || true
