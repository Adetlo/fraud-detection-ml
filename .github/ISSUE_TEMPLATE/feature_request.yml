name: Feature request
description: Propose a capability or design change for Fraud Detection ML.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing or risky today? Reference the README or docs section where relevant.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: What should the project do instead, and how would a user or operator exercise it?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Architectural impact
      description: Does this touch the input/output contracts (docs/DATA_CONTRACT.md), FEATURE_VERSION, the threshold policy (docs/THRESHOLDING.md) or model governance (docs/MODEL_GOVERNANCE.md)? Changes to documented decisions normally need a new ADR.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
